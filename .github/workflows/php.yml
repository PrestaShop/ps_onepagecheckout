name: PHP tests
on: [push, pull_request]
jobs:
  php-linter:
    name: PHP Syntax check 8.1 => 8.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP syntax checker 8.1
        uses: prestashop/github-action-php-lint/8.1@master

      - name: PHP syntax checker 8.2
        uses: prestashop/github-action-php-lint/8.2@master

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: composer install

      - name: Run PHP-CS-Fixer
        run: composer run cs-fixer:dry

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        presta-versions: ['latest']
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: composer install

      - name: Execute PHPStan on PrestaShop (Tag ${{ matrix.presta-versions }})
        run: ./tests/php/phpstan.sh ${{ matrix.presta-versions }}

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prestashop:
          # Keep the checkout ref and Docker image tag aligned when adding more supported versions.
          - label: latest
            image_tag: latest
            core_ref: ''
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout PrestaShop core (default branch)
        if: ${{ matrix.prestashop.core_ref == '' }}
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          path: prestashop-core

      - name: Checkout PrestaShop core (${{ matrix.prestashop.core_ref }})
        if: ${{ matrix.prestashop.core_ref != '' }}
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop.core_ref }}
          path: prestashop-core

      - name: Install PrestaShop core dependencies
        working-directory: prestashop-core
        run: composer install --no-interaction --prefer-dist

      - name: Execute unit tests on PrestaShop (Tag ${{ matrix.prestashop.image_tag }})
        env:
          PS_ROOT_DIR_HOST: ${{ github.workspace }}/prestashop-core
        run: ./scripts/run-tests.sh unit ${{ matrix.prestashop.image_tag }}

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prestashop:
          # Keep the checkout ref and Docker image tag aligned when adding more supported versions.
          - label: latest
            image_tag: latest
            core_ref: ''
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout PrestaShop core (default branch)
        if: ${{ matrix.prestashop.core_ref == '' }}
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          path: prestashop-core

      - name: Checkout PrestaShop core (${{ matrix.prestashop.core_ref }})
        if: ${{ matrix.prestashop.core_ref != '' }}
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ matrix.prestashop.core_ref }}
          path: prestashop-core

      - name: Install PrestaShop core dependencies
        working-directory: prestashop-core
        run: composer install --no-interaction --prefer-dist

      - name: Execute integration tests on PrestaShop (Tag ${{ matrix.prestashop.image_tag }})
        env:
          PS_ROOT_DIR_HOST: ${{ github.workspace }}/prestashop-core
        run: ./scripts/run-tests.sh integration ${{ matrix.prestashop.image_tag }}
