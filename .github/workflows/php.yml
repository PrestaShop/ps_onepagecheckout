name: PHP tests
on: [push, pull_request]
jobs:
  php-linter:
    name: PHP Syntax check 8.1 => 8.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP syntax checker 8.1
        uses: prestashop/github-action-php-lint/8.1@master

      - name: PHP syntax checker 8.2
        uses: prestashop/github-action-php-lint/8.2@master

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: composer install

      - name: Run PHP-CS-Fixer
        run: composer run cs-fixer:dry

  prestashop:
    name: Resolve latest PrestaShop release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # Every run tests the release merchants install, resolved once so all jobs test
      # the same version and no tag has to be maintained here.
      - name: Resolve latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/PrestaShop/PrestaShop/releases/latest --jq .tag_name)
          if ! [[ "${version}" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::GitHub returned no usable latest PrestaShop release: '${version}'." >&2
            exit 1
          fi
          if ! docker manifest inspect "prestashop/prestashop:${version}" >/dev/null; then
            echo "::error::Image prestashop/prestashop:${version} is not on Docker Hub yet." >&2
            exit 1
          fi
          echo "Latest PrestaShop release: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  phpstan:
    name: PHPStan
    needs: prestashop
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout PrestaShop core ${{ needs.prestashop.outputs.version }}
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ needs.prestashop.outputs.version }}
          path: prestashop-core

      - name: Install PrestaShop core dependencies
        working-directory: prestashop-core
        run: composer install --no-interaction --prefer-dist

      - name: Install dependencies
        run: composer install

      - name: Execute PHPStan on PrestaShop ${{ needs.prestashop.outputs.version }}
        env:
          PS_ROOT_DIR_HOST: ${{ github.workspace }}/prestashop-core
        run: ./tests/php/phpstan.sh latest

  unit-tests:
    name: Unit tests
    needs: prestashop
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout PrestaShop core ${{ needs.prestashop.outputs.version }}
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ needs.prestashop.outputs.version }}
          path: prestashop-core

      - name: Install PrestaShop core dependencies
        working-directory: prestashop-core
        run: composer install --no-interaction --prefer-dist

      - name: Execute unit tests on PrestaShop ${{ needs.prestashop.outputs.version }}
        env:
          PS_ROOT_DIR_HOST: ${{ github.workspace }}/prestashop-core
        run: ./scripts/run-tests.sh unit ${{ needs.prestashop.outputs.version }}

  integration-tests:
    name: Integration tests
    needs: prestashop
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout PrestaShop core ${{ needs.prestashop.outputs.version }}
        uses: actions/checkout@v5
        with:
          repository: PrestaShop/PrestaShop
          ref: ${{ needs.prestashop.outputs.version }}
          path: prestashop-core

      - name: Install PrestaShop core dependencies
        working-directory: prestashop-core
        run: composer install --no-interaction --prefer-dist

      - name: Execute integration tests on PrestaShop ${{ needs.prestashop.outputs.version }}
        env:
          PS_ROOT_DIR_HOST: ${{ github.workspace }}/prestashop-core
        run: ./scripts/run-tests.sh integration ${{ needs.prestashop.outputs.version }}
