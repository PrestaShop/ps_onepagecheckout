name: Bug report
description: Something in the one-page checkout does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: A maintainer sets the severity after triage, from the facts below.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Start from an empty cart and list every step.
      placeholder: |
        1. Add a product to the cart
        2. Go to the checkout as a guest
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What the buyer or the merchant sees. Add screenshots or error messages.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Checkout step
      options:
        - Contact
        - Address
        - Carrier
        - Payment
        - Final submit
        - Back office
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - The order cannot be placed
        - A wrong amount is shown or charged
        - Data is lost
        - Wrong data is shown
        - A task is blocked
        - Annoying, easy to work around
        - Cosmetic
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Is there a way to complete the order anyway? Write "none" if not.
  - type: input
    id: ps-version
    attributes:
      label: PrestaShop version
      placeholder: shown at the bottom of the back office
    validations:
      required: true
  - type: input
    id: module-version
    attributes:
      label: Module version
      placeholder: shown in the Module Manager
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: shown in Advanced Parameters > Information
    validations:
      required: true
  - type: input
    id: theme
    attributes:
      label: Theme
      placeholder: e.g. Hummingbird, or the name of a custom theme
